name: tests
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.9", "3.12", "3.13"]
        include:
          - os: macos-latest
            python: "3.9"
          - os: macos-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # setup-python no longer ships 3.9 for current Ubuntu images; uv's standalone builds do
      - uses: astral-sh/setup-uv@v6
      - name: Install
        run: |
          uv venv -p ${{ matrix.python }} .venv
          uv pip install -p .venv -e '.[test]'
          .venv/bin/python --version
      - name: Tests (offline, synthetic responses)
        run: .venv/bin/python -m pytest -q
      - name: CLI smoke test (offline)
        run: |
          .venv/bin/paper-audit --help
          set +e
          .venv/bin/paper-audit "not a paper" -o /tmp/o --no-clone
          code=$?
          set -e
          test "$code" -eq 2
