[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-repro-auditor"
version = "0.1.0"
description = "Audit whether a publication links everything needed to reproduce its computational results."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Yenula-W"}]
keywords = ["reproducibility", "research software", "open science", "data availability"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
]
dependencies = ["requests>=2.25", "pypdf>=3.0"]

[project.urls]
Homepage = "https://github.com/Yenula-W/paper-repro-auditor"
Repository = "https://github.com/Yenula-W/paper-repro-auditor"
Issues = "https://github.com/Yenula-W/paper-repro-auditor/issues"

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
paper-audit = "paper_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
